<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tech Journal</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License - https://github.com/rafgraph/spa-github-pages
    // Converts deep 404 path into a query parameter for index.html to decode via History API
    (function() {
      var pathSegmentsToKeep = 1; // for /tech-journal/ or /leetcode-journal/
      var l = window.location;

      // Quick shortcuts table: allows typing /1, /15, /42, /0001, etc. directly
      var shortcuts = {
        '1': '0001-two-sum',
        '0001': '0001-two-sum',
        '3': '0003-longest-substring-without-repeating-characters',
        '0003': '0003-longest-substring-without-repeating-characters',
        '11': '0011-container-with-most-water',
        '0011': '0011-container-with-most-water',
        '15': '0015-3sum',
        '0015': '0015-3sum',
        '20': '0020-valid-parentheses',
        '0020': '0020-valid-parentheses',
        '36': '0036-valid-sudoku',
        '0036': '0036-valid-sudoku',
        '42': '0042-trapping-rain-water',
        '0042': '0042-trapping-rain-water',
        '49': '0049-group-anagrams',
        '0049': '0049-group-anagrams',
        '76': '0076-minimum-window-substring',
        '0076': '0076-minimum-window-substring',
        '121': '0121-best-time-to-buy-and-sell-stock',
        '0121': '0121-best-time-to-buy-and-sell-stock',
        '125': '0125-valid-palindrome',
        '0125': '0125-valid-palindrome',
        '128': '0128-longest-consecutive-sequence',
        '0128': '0128-longest-consecutive-sequence',
        '150': '0150-evaluate-reverse-polish-notation',
        '0150': '0150-evaluate-reverse-polish-notation',
        '155': '0155-min-stack',
        '0155': '0155-min-stack',
        '167': '0167-two-sum-ii-input-array-is-sorted',
        '0167': '0167-two-sum-ii-input-array-is-sorted',
        '217': '0217-contains-duplicate',
        '0217': '0217-contains-duplicate',
        '238': '0238-product-of-array-except-self',
        '0238': '0238-product-of-array-except-self',
        '239': '0239-sliding-window-maximum',
        '0239': '0239-sliding-window-maximum',
        '242': '0242-valid-anagram',
        '0242': '0242-valid-anagram',
        '271': '0271-encode-and-decode-strings',
        '0271': '0271-encode-and-decode-strings',
        '347': '0347-top-k-frequent-elements',
        '0347': '0347-top-k-frequent-elements',
        '424': '0424-longest-repeating-character-replacement',
        '0424': '0424-longest-repeating-character-replacement',
        '567': '0567-permutation-in-string',
        '0567': '0567-permutation-in-string',
        '739': '0739-daily-temperatures',
        '0739': '0739-daily-temperatures'
      };

      var rawPath = l.pathname;
      var matchNumber = rawPath.match(/\/(?:tech-journal|leetcode-journal)\/(\d{1,4})\/?$/);
      if (matchNumber && shortcuts[matchNumber[1]]) {
        var basePrefix = rawPath.match(/^\/(?:tech-journal|leetcode-journal)/)[0];
        rawPath = basePrefix + '/problems/' + shortcuts[matchNumber[1]];
      }

      var redirectPath = rawPath.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var redirectSearch = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        rawPath.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        redirectPath +
        redirectSearch +
        l.hash
      );
    })();
  </script>
</head>
<body>
</body>
</html>
