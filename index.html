  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Single Page Apps for GitHub Pages: Clean URL without '#' (History Mode) -->
  <script type="text/javascript">
    (function(l) {
      // Decode path from 404 redirect query string (?/path)
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      } else if (l.hash && l.hash.indexOf('#/') === 0) {
        // Upgrade any legacy hash URL (#/...) into clean URL without '#'
        var cleanPath = l.hash.slice(2);
        var base = l.pathname.replace(/\/$/, '');
        var target = base + (cleanPath ? '/' + cleanPath.replace(/^\//, '') : '/');
        window.history.replaceState(null, null, target);
      }
    }(window.location));
  </script>

  <style>
    /* ==========================================================================
       NOTION MINIMALIST DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-canvas: #ffffff;
      --bg-sidebar: #f7f6f5;
      --bg-hover: rgba(55, 53, 47, 0.06);
      --bg-active: rgba(55, 53, 47, 0.08);
      --border-subtle: rgba(55, 53, 47, 0.09);
      --border-hover: rgba(55, 53, 47, 0.16);
      --border-focus: rgba(35, 131, 226, 0.4);
      --text-primary: #37352f;
      --text-secondary: #787774;
      --text-muted: #9b9a97;
      --text-faint: #b4b3b0;
      --accent-blue: #2383e2;
      --accent-blue-light: #edf5fa;
      --tag-easy-bg: #edf6f0;
      --tag-easy-text: #2e7a48;
      --tag-easy-border: #d3ebd8;
      --tag-medium-bg: #fbf3db;
      --tag-medium-text: #8f6b00;
      --tag-medium-border: #faeec7;
      --tag-hard-bg: #fdebec;
      --tag-hard-text: #c44046;
      --tag-hard-border: #f9d3d5;
      --tag-solved-bg: #edf5fa;
      --tag-solved-text: #287099;
      --tag-solved-border: #d4e7f3;
      --code-bg: #1e2227;
      --code-text: #abb2bf;
      --code-selection: #284c75;
      --code-comment-selected: #9aa3b5;
      --callout-bg: #f1f1ef;
      --theme-color: #2383e2;
    }

    /* Global Reset & Typography */
    html, body {
      background-color: var(--bg-canvas) !important;
      color: var(--text-primary) !important;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Selection & Scrollbars */
    ::selection {
      background: rgba(35, 131, 226, 0.22) !important;
    }
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(55, 53, 47, 0.14);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(55, 53, 47, 0.28);
    }

    /* ==========================================================================
       NOTION SIDEBAR
       ========================================================================== */
    .sidebar {
      background: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border-subtle) !important;
      color: var(--text-secondary) !important;
      padding: 20px 14px;
      font-size: 14px;
    }
    .sidebar > h1 {
      margin: 0 0 16px 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .sidebar > h1 .app-name-link {
      color: var(--text-primary) !important;
      text-decoration: none !important;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-nav strong {
      color: var(--text-muted) !important;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: block;
      margin: 20px 0 6px 8px;
    }
    .sidebar-nav ul {
      padding-left: 0 !important;
      margin: 0 !important;
    }
    .sidebar-nav li {
      margin: 2px 0 !important;
      list-style: none !important;
    }
    .sidebar-nav li a {
      color: var(--text-secondary) !important;
      text-decoration: none !important;
      display: block;
      padding: 5px 10px;
      border-radius: 4px;
      transition: all 0.15s ease;
      font-size: 13.5px;
      border: none !important;
    }
    .sidebar-nav li a:hover {
      color: var(--text-primary) !important;
      background: var(--bg-hover) !important;
    }
    .sidebar-nav li.active > a {
      color: var(--text-primary) !important;
      background: var(--bg-active) !important;
      font-weight: 600 !important;
    }

    /* ==========================================================================
       SIDEBAR SEARCH COMPONENT (Notion Quick Search Style)
       ========================================================================== */
    .sidebar .search {
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 14px;
    }
    .sidebar .search input {
      background: #ffffff !important;
      border: 1px solid var(--border-hover) !important;
      color: var(--text-primary) !important;
      border-radius: 6px !important;
      padding: 7px 11px !important;
      font-size: 13px !important;
      font-family: inherit !important;
      transition: all 0.15s ease;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
    }
    .sidebar .search input:focus {
      border-color: var(--accent-blue) !important;
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.2) !important;
      outline: none;
    }
    .sidebar .search input::placeholder {
      color: var(--text-muted) !important;
    }

    /* Search Results Popover Panel */
    .sidebar .search .results-panel {
      display: none;
      background: #ffffff !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 6px !important;
      box-shadow: 0 4px 16px rgba(15, 15, 15, 0.08) !important;
      padding: 6px !important;
      margin-top: 8px !important;
      max-height: 380px;
      overflow-y: auto;
    }
    .sidebar .search .results-panel.show {
      display: block !important;
    }
    .sidebar .search .matching-post {
      padding: 7px 9px !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      border-radius: 4px !important;
      transition: background 0.15s ease !important;
      margin-bottom: 2px !important;
    }
    .sidebar .search .matching-post:last-child {
      border-bottom: none !important;
    }
    .sidebar .search .matching-post:hover {
      background: var(--bg-hover) !important;
    }
    .sidebar .search .matching-post a {
      text-decoration: none !important;
      display: block;
    }
    .sidebar .search .matching-post h2 {
      font-size: 13px !important;
      font-weight: 600 !important;
      color: var(--text-primary) !important;
      margin: 0 0 2px 0 !important;
      border: none !important;
      padding: 0 !important;
    }
    .sidebar .search .matching-post p {
      font-size: 11.5px !important;
      color: var(--text-secondary) !important;
      margin: 0 !important;
      line-height: 1.4 !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar .search .search-keyword {
      background: rgba(35, 131, 226, 0.12) !important;
      color: var(--accent-blue) !important;
      padding: 0 3px !important;
      border-radius: 2px !important;
      font-style: normal !important;
      font-weight: 600 !important;
    }
    .sidebar .search .clear-btn {
      color: var(--text-muted) !important;
    }

    /* ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== */
    .content {
      background: var(--bg-canvas) !important;
      padding-top: 10px;
    }
    .markdown-section {
      max-width: 1160px !important;
      padding: 30px 40px 80px 40px !important;
      color: var(--text-primary) !important;
    }

    /* Headings (Notion Scale) */
    .markdown-section h1 {
      color: var(--text-primary) !important;
      font-size: 2.1rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.025em !important;
      margin-top: 0 !important;
      margin-bottom: 1.2rem !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
    }
    .markdown-section h2 {
      color: var(--text-primary) !important;
      font-size: 1.45rem !important;
      font-weight: 600 !important;
      letter-spacing: -0.015em !important;
      margin-top: 2.2rem !important;
      margin-bottom: 0.8rem !important;
      padding-bottom: 0 !important;
      border-bottom: none !important;
    }
    .markdown-section h3 {
      color: var(--text-primary) !important;
      font-size: 1.18rem !important;
      font-weight: 600 !important;
      letter-spacing: -0.01em !important;
      margin-top: 1.7rem !important;
      margin-bottom: 0.6rem !important;
    }
    .markdown-section h4 {
      color: var(--text-primary) !important;
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      margin-top: 1.3rem !important;
      margin-bottom: 0.4rem !important;
    }

    /* Horizontal Rules */
    .markdown-section hr {
      border: none;
      height: 1px;
      background: var(--border-subtle);
      margin: 2rem 0;
    }

    /* Notion Callout Box / Blockquotes */
    .markdown-section blockquote {
      background: var(--callout-bg) !important;
      border-left: none !important;
      border-radius: 4px !important;
      padding: 14px 18px !important;
      margin: 1.4rem 0 !important;
      color: var(--text-primary) !important;
      font-size: 14.5px;
    }
    .markdown-section blockquote p {
      margin: 0 !important;
    }

    /* Links */
    .markdown-section a {
      color: var(--text-primary) !important;
      text-decoration: underline !important;
      text-decoration-color: rgba(55, 53, 47, 0.25) !important;
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s ease;
    }
    .markdown-section a:hover {
      text-decoration-color: var(--text-primary) !important;
    }

    /* Inline Code (Notion Red/Warm Charcoal) */
    .markdown-section p code,
    .markdown-section li code,
    .markdown-section td code {
      background: rgba(135, 131, 120, 0.15) !important;
      color: #eb5757 !important;
      padding: 2px 5px !important;
      border-radius: 3px !important;
      font-family: 'JetBrains Mono', 'Consolas', monospace !important;
      font-size: 85% !important;
      border: none !important;
    }

    /* Code Blocks (Clean Dark Editor) */
    .markdown-section pre {
      background: var(--code-bg) !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      border-radius: 6px !important;
      padding: 18px 20px !important;
      margin: 1.4rem 0 !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) !important;
      position: relative;
    }
    .markdown-section pre > code {
      background: transparent !important;
      color: var(--code-text) !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace !important;
      font-size: 13.5px !important;
      line-height: 1.65 !important;
      padding: 0 !important;
    }

    /* Prism Syntax Highlighting (One Dark / Atom Dark) */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #5c6370 !important; font-style: italic; }
    .token.punctuation { color: #abb2bf !important; }
    .token.property, .token.tag, .token.boolean, .token.number, .token.constant, .token.symbol { color: #d19a66 !important; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin { color: #98c379 !important; }
    .token.operator, .token.entity, .token.url, .language-css .token.string, .style .token.string { color: #56b6c2 !important; }
    .token.atrule, .token.attr-value, .token.keyword { color: #c678dd !important; font-weight: 500; }
    .token.function, .token.class-name { color: #61afef !important; }
    .token.regex, .token.important, .token.variable { color: #e06c75 !important; }

    /* Code Blocks Text Selection (VS Code / One Dark Style) */
    .markdown-section pre::selection,
    .markdown-section pre *::selection {
      background: var(--code-selection) !important;
    }
    .markdown-section pre .token.comment::selection {
      color: var(--code-comment-selected) !important;
    }

    /* Copy Code Button */
    .docsify-copy-code-button {
      background: rgba(255, 255, 255, 0.15) !important;
      color: #e5e5e5 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 4px !important;
      padding: 4px 9px !important;
      font-size: 11.5px !important;
      font-family: inherit !important;
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .docsify-copy-code-button:hover {
      background: rgba(255, 255, 255, 0.28) !important;
      color: #ffffff !important;
    }

    /* ==========================================================================
       NOTION DATABASE TABLES
       ========================================================================== */
    .markdown-section table {
      width: 100% !important;
      display: table !important;
      table-layout: auto !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      margin: 1.6rem 0 !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 6px !important;
      background: #ffffff !important;
    }
    .markdown-section table tr,
    .markdown-section table tr:nth-child(2n),
    .markdown-section table tr:nth-child(2n+1),
    .markdown-section table tbody tr,
    .markdown-section table tbody tr:nth-child(2n),
    .markdown-section table tbody tr:nth-child(2n+1) {
      background: #ffffff !important;
      background-color: #ffffff !important;
      border: none !important;
    }
    .markdown-section table th {
      background: #f7f6f5 !important;
      background-color: #f7f6f5 !important;
      color: var(--text-secondary) !important;
      font-weight: 500 !important;
      font-size: 11.5px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      padding: 10px 14px !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      white-space: nowrap;
    }
    .markdown-section table td {
      background: #ffffff !important;
      background-color: #ffffff !important;
      padding: 10px 14px !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      color: var(--text-primary) !important;
      font-size: 13.5px !important;
      font-variant-numeric: tabular-nums;
      vertical-align: middle;
    }
    .markdown-section table tr:last-child td {
      border-bottom: none !important;
    }
    .markdown-section table tr:hover td {
      background-color: rgba(55, 53, 47, 0.035) !important;
    }

    /* Markdown Table Alignment Support (Respect :---: and :--- and ---:) */
    .markdown-section table th[align="center"],
    .markdown-section table td[align="center"],
    .markdown-section table th[style*="text-align: center"],
    .markdown-section table td[style*="text-align: center"],
    .markdown-section table th[style*="text-align:center"],
    .markdown-section table td[style*="text-align:center"] {
      text-align: center !important;
    }
    .markdown-section table th[align="right"],
    .markdown-section table td[align="right"],
    .markdown-section table th[style*="text-align: right"],
    .markdown-section table td[style*="text-align: right"],
    .markdown-section table th[style*="text-align:right"],
    .markdown-section table td[style*="text-align:right"] {
      text-align: right !important;
    }
    .markdown-section table th[align="left"],
    .markdown-section table td[align="left"],
    .markdown-section table th[style*="text-align: left"],
    .markdown-section table td[style*="text-align: left"],
    .markdown-section table th[style*="text-align:left"],
    .markdown-section table td[style*="text-align:left"] {
      text-align: left !important;
    }

    /* Progress Tracker Metric Card (Compact, Centered, Proportional) */
    h3[id*="progress-tracker"] + table,
    #progress-tracker + table {
      max-width: 640px !important;
      width: 100% !important;
      margin: 1.2rem 0 2rem 0 !important;
    }
    h3[id*="progress-tracker"] + table th,
    h3[id*="progress-tracker"] + table td,
    #progress-tracker + table th,
    #progress-tracker + table td {
      text-align: center !important;
      padding: 10px 14px !important;
    }
    h3[id*="progress-tracker"] + table td,
    #progress-tracker + table td {
      font-size: 14.5px !important;
      font-weight: 600 !important;
    }
    h3[id*="progress-tracker"] + table td:first-child,
    #progress-tracker + table td:first-child {
      font-family: inherit !important;
      font-size: 14.5px !important;
      font-weight: 700 !important;
      color: var(--accent-blue) !important;
    }

    /* Solved Notes Table: Monospace IDs & Column Badges */
    .markdown-section table td:first-child {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 12.5px !important;
      color: var(--text-muted) !important;
      white-space: nowrap;
    }
    .markdown-section table td:nth-child(3),
    .markdown-section table td:nth-child(5),
    .markdown-section table td:nth-child(6),
    .markdown-section table td:nth-child(7) {
      white-space: nowrap;
    }

    /* Notion Database Multi-Select Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 3px;
      line-height: 1.4;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-decoration: none !important;
    }
    .badge-easy {
      background: var(--tag-easy-bg) !important;
      color: var(--tag-easy-text) !important;
      border: 1px solid var(--tag-easy-border) !important;
    }
    .badge-medium {
      background: var(--tag-medium-bg) !important;
      color: var(--tag-medium-text) !important;
      border: 1px solid var(--tag-medium-border) !important;
    }
    .badge-hard {
      background: var(--tag-hard-bg) !important;
      color: var(--tag-hard-text) !important;
      border: 1px solid var(--tag-hard-border) !important;
    }
    .badge-solved {
      background: var(--tag-solved-bg) !important;
      color: var(--tag-solved-text) !important;
      border: 1px solid var(--tag-solved-border) !important;
    }
    .badge-solved::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--tag-solved-text);
      margin-right: 5px;
    }

    /* Notion Button Link Pill in Tables */
    .markdown-section table td a[href*="problems/"] {
      display: inline-flex !important;
      align-items: center !important;
      padding: 2px 8px !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      color: var(--text-primary) !important;
      background: #f1f1ef !important;
      border: 1px solid rgba(55, 53, 47, 0.12) !important;
      border-radius: 4px !important;
      text-decoration: none !important;
      transition: all 0.15s ease !important;
    }
    .markdown-section table td a[href*="problems/"]:hover {
      background: #e3e2de !important;
      border-color: rgba(55, 53, 47, 0.2) !important;
    }

    /* ==========================================================================
       KATEX FORMULA STYLING
       ========================================================================== */
    .katex {
      font-size: 1.02em !important;
      color: var(--text-primary) !important;
    }
    .katex-display {
      margin: 1.2rem 0 !important;
      padding: 12px 16px;
      background: #f7f6f5;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* ==========================================================================
       TASK LISTS & CHECKBOXES (Notion Style)
       ========================================================================== */
    .markdown-section ul.task-list,
    .markdown-section .task-list-item {
      list-style-type: none !important;
    }
    .markdown-section input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid rgba(55, 53, 47, 0.35);
      border-radius: 3px;
      outline: none;
      background: #ffffff;
      cursor: pointer;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      vertical-align: middle !important;
      margin: 0 10px 0 0 !important;
      position: relative;
      top: -1px;
      transition: all 0.15s ease;
    }
    .markdown-section input[type="checkbox"]:checked {
      background-color: var(--accent-blue) !important;
      border-color: var(--accent-blue) !important;
    }
    .markdown-section input[type="checkbox"]:checked::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      position: relative;
      top: -1px;
    }
    .markdown-section li > p {
      display: inline !important;
      margin: 0 !important;
    }
    .markdown-section li > ol {
      display: inline-block !important;
      margin: 0 !important;
      padding-left: 0 !important;
      vertical-align: middle !important;
    }
    .markdown-section li {
      margin: 6px 0;
      line-height: 1.7;
    }

    /* Hide GitHub corner ribbon */
    .github-corner {
      display: none !important;
    }

    /* ==========================================================================
       SIDEBAR TOGGLE BUTTON (Mobile Only)
       ========================================================================== */
    @media screen and (min-width: 769px) {

                  var base = (this.getBasePath() || '').replace(/\/$/, '');
                  if (base && (res.path === base || res.path.indexOf(base + '/') === 0)) {
                    var stripped = res.path.slice(base.length);
                    res.path = stripped.indexOf('/') === 0 ? stripped : '/' + stripped;
                    res.file = this.getFile(res.path);
                  }
                  return res;
                };

                var origToURL = r.toURL;
                r.toURL = function (path, params, currentRoute) {
                  var url = origToURL.call(this, path, params, currentRoute);
                  var base = (this.getBasePath() || '').replace(/\/$/, '');
                  if (base && url.indexOf(base) !== 0) {
                    url = base + (url.indexOf('/') === 0 ? url : '/' + url);
